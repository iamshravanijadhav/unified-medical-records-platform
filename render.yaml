services:
  - type: web
    name: unified-medical-records-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: EXCHANGE_GATEWAY_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false

